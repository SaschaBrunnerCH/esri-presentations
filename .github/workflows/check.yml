name: Check presentations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-presentations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build presentations
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm run check
